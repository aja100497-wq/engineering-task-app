<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>설계 업무 보드</title>
<style>
:root{font-family:Arial,'Malgun Gothic',sans-serif;color:#19314b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#142b45;color:white;padding:36px max(24px,calc((100vw - 1120px)/2))}header small{color:#86d6d1;letter-spacing:2px}h1{margin:12px 0;font-size:32px}header p{color:#c2cfdd;line-height:1.7}main{max-width:1168px;margin:auto;padding:26px 24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat,.panel{background:white;border:1px solid #dde5ef;border-radius:16px;padding:22px}.stat strong{display:block;font-size:32px;margin-top:12px}.stat span{color:#687b90}.panel{margin-top:20px}h2{font-size:18px;margin:0 0 20px}form{display:grid;grid-template-columns:1.1fr 2fr 1fr 1fr auto;gap:12px;align-items:end}label{display:block;font-size:13px;font-weight:bold}input,select,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #cdd8e5}input,select{width:100%;margin-top:8px;background:white;color:#19314b}button{cursor:pointer;background:#087c79;color:white;border:0;font-weight:bold}button:hover{filter:brightness(.93)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #70bdbc;outline-offset:2px}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.toolbar label{flex:1;min-width:160px}.secondary{background:#e8f0f6;color:#19314b}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;margin-top:20px;font-size:14px}th,td{text-align:left;padding:16px 10px;border-bottom:1px solid #edf1f6}th{color:#687b90;font-size:12px}td select{min-width:110px;margin:0}td:nth-child(2){min-width:190px;font-weight:bold}.delete{color:#a34343;background:#fff0ef;padding:9px}.late{color:#b64434;font-weight:bold}#notice{font-size:13px;color:#925c13;line-height:1.7}footer{font-size:12px;color:#687b90;margin-top:18px;line-height:1.8}.empty{text-align:center;color:#687b90;padding:35px}@media(max-width:800px){form{grid-template-columns:1fr 1fr}form label:nth-child(2){grid-column:1/-1}form button{min-height:44px}.stat,.panel{padding:16px}header{padding:28px 24px}h1{font-size:27px}}@media(max-width:440px){main{padding:16px 12px}.stats{gap:8px}.stat{padding:12px}.stat span{font-size:12px}}
</style>
</head>
<body>
<header><small>ENGINEERING / WORKSPACE</small><h1>설계 업무 보드</h1><p>도면 검토부터 고객 승인까지, 해야 할 일을 한눈에.<br>GitHub로 시작하는 나만의 첫 번째 앱</p></header>
<main>
<section class="stats" aria-label="업무 현황"><div class="stat"><span>전체 업무</span><strong id="total">0</strong></div><div class="stat"><span>진행 중</span><strong id="active">0</strong></div><div class="stat"><span>마감 지연</span><strong id="late">0</strong></div></section>
<section class="panel"><h2>새 업무 등록</h2><form id="task-form"><label>프로젝트<input id="project" maxlength="60" placeholder="예: ATS Demo" required></label><label>업무 내용<input id="title" maxlength="160" placeholder="예: 고객 승인도 검토" required></label><label>담당자<input id="owner" maxlength="40" placeholder="예: 김설계" required></label><label>마감일<input id="due" type="date" required></label><button type="submit">+ 업무 추가</button></form></section>
<section class="panel"><h2>업무 목록</h2><div class="toolbar"><label>검색<input id="search" type="search" placeholder="프로젝트, 업무, 담당자 검색"></label><label>상태 필터<select id="filter"><option value="">전체 상태</option><option>대기</option><option>진행 중</option><option>완료</option></select></label><button class="secondary" id="export">백업 저장</button><button class="secondary" id="import">백업 불러오기</button><input id="file" type="file" accept=".json,application/json" hidden></div><div class="table-wrap"><table><thead><tr><th>프로젝트</th><th>업무 내용</th><th>담당자</th><th>마감일</th><th>상태</th><th>관리</th></tr></thead><tbody id="tasks"></tbody></table></div><p id="notice" role="status" aria-live="polite"></p></section>
<footer>처음 표시되는 업무는 가상 예시입니다. 입력 내용은 이 브라우저에 저장되며 다른 기기와 동기화되지 않습니다.<br>브라우저 데이터 삭제 전 ‘백업 저장’을 이용하세요. 여러 탭에서 동시에 수정하지 마세요.</footer>
</main><script src="app.js"></script>
</body></html>
